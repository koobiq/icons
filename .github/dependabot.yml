version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    # A release is proposed only once it is a week old, so a compromised version is caught
    # before it reaches a pull request.
    cooldown:
      default-days: 7
  - package-ecosystem: 'npm'
    directory: '/'
    versioning-strategy: 'increase'
    schedule:
      interval: 'monthly'
    # Has to stay at least as long as npmMinimalAgeGate in .yarnrc.yml: Dependabot does not read
    # the gate when it picks a version, and yarn refuses to install a younger one. The same window
    # also holds back the transitive dependencies Dependabot resolves into the lockfile. Security
    # updates are not delayed. Our own packages are taken as soon as they are published.
    cooldown:
      default-days: 7
      exclude:
        - '@koobiq/*'
    ignore:
      # Ignores any major updates
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'ng-packagr'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - 'eslint-plugin-react*'
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'vite-*'
      eslint:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
          - '@types/eslint'
      commitlint:
        patterns:
          - '@commitlint/*'
      prettier:
        patterns:
          - 'prettier*'
      svgr:
        patterns:
          - '@svgr/*'
      figma-export:
        patterns:
          - '@figma-export/*'
      koobiq:
        patterns:
          - '@koobiq/*'
