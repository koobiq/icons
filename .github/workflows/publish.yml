name: Publish

on:
  push:
    tags:
      # Matches both plain fixed-group tags ({version})
      # and project-scoped tags ({projectName}@{version}.
      - '*.*.*'
  # Entry point for backfilling or retrying the GitHub Release for a tag that's already on npm.
  # Never republishes to npm — see the `publish` job's `if`.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create the GitHub release for
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'koobiq' && github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
      # Needed for provenance data generation
      # https://nx.dev/recipes/nx-release/publish-in-ci-cd#npm-provenance
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Yarn
        uses: ./.github/workflows/actions/setup-yarn

      - run: yarn nx release publish --registry=$REGISTRY
        env:
          REGISTRY: https://registry.npmjs.org/
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # Reads the changelog straight from the checkout via @koobiq/cli/release (see
      # .github/scripts/release-notify.ts), so the notification doesn't depend on GitHub
      # at all — not the Release object (created separately by the `github-release` job
      # below) and not the API.
      - name: Build release notes
        id: notes
        run: |
          {
            echo "text<<RELEASE_NOTES_EOF"
            npx tsx .github/scripts/release-notify.ts "${{ github.ref_name }}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: mattermost/action-mattermost-notify@2.0.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
          MATTERMOST_CHANNEL: ${{ secrets.MM_CHANNEL_NAME }}
          MATTERMOST_USERNAME: ${{ secrets.MM_BOT_NAME }}
          TEXT: '${{ steps.notes.outputs.text }}'

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    # Runs after a successful publish, and also standalone on workflow_dispatch (publish is
    # skipped there, not failed/cancelled). Purely cosmetic (release page / "Latest" badge) —
    # never blocks or gates the npm publish above.
    if: ${{ !cancelled() && !failure() && github.repository_owner == 'koobiq' }}
    concurrency:
      group: github-release-latest-badge
      cancel-in-progress: false
    permissions:
      contents: write # for `gh release create`
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Create GitHub release
        run: |
          set -euo pipefail

          # Accepts both plain ({version}) and project-scoped ({projectName}@{version}) tags.
          if ! printf '%s' "$TAG" | grep -qE '^([A-Za-z0-9._/-]+@)?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$TAG\" is not a release tag."
            exit 1
          fi

          # A re-run, or a dispatch for a tag already handled, must neither fail nor duplicate.
          if release_error=$(gh release view "$TAG" 2>&1 1>/dev/null); then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          elif [ "$release_error" != "release not found" ]; then
            echo "::error::gh release view \"$TAG\" failed: $release_error"
            exit 1
          fi

          gh release create "$TAG" \
            --verify-tag \
            --generate-notes \
            --title "$TAG" \
            --latest
