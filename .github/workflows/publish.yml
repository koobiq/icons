name: Publish

on:
  push:
    tags:
      # Matches both plain fixed-group tags ({version})
      # and project-scoped tags ({projectName}@{version}.
      - '*.*.*'
  # Allows you to run this workflow manually
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Needed for provenance data generation
  # https://nx.dev/recipes/nx-release/publish-in-ci-cd#npm-provenance
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'koobiq' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Yarn
        uses: ./.github/workflows/actions/setup-yarn

      # `latest` must always track the current major line. Without this, publishing a patch on an
      # older major's maintenance branch (e.g. 10.10.x, v11.7.x) after a newer major has shipped
      # would flip `latest` backward, since `nx release publish` defaults to tagging `latest`
      # unconditionally. Older majors get their own `v<major>-lts` tag instead. Resolution itself
      # lives in @koobiq/cli (`resolve-npm-tag`), shared with every other koobiq npm package, so
      # this comparison isn't reimplemented per repo. All 4 packages here are one fixed Nx release
      # group (one shared version), so a single check against @koobiq/icons decides the tag for
      # the whole `nx release publish --tag=...` run.
      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          set -euo pipefail

          # `yarn dlx` writes its install logs to stdout, so the raw substitution picks them up
          # alongside the tag, $GITHUB_OUTPUT gets a multi-line value and the step dies with
          # `Invalid format '➤ YN0000: ┌ Resolution step'`. `--quiet` drops those logs; the grep
          # keeps only lines shaped like an npm dist-tag, so any leftover yarn chrome (all of it
          # either starts with `➤` or contains spaces) can never reach the output again.
          RAW=$(yarn dlx --quiet @koobiq/cli@20.3.0 resolve-npm-tag --package-name @koobiq/icons -p packages/icons)
          TAG=$(printf '%s\n' "$RAW" | grep -E '^[A-Za-z0-9][A-Za-z0-9._-]*$' | tail -n 1 || true)

          if [ -z "$TAG" ]; then
            echo "resolve-npm-tag did not return a usable dist-tag. Raw output:" >&2
            printf '%s\n' "$RAW" >&2
            exit 1
          fi

          echo "Resolved npm dist-tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - run: yarn nx release publish --registry=$REGISTRY --tag=${{ steps.dist-tag.outputs.tag }}
        env:
          REGISTRY: https://registry.npmjs.org/
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
