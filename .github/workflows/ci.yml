name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: read-all

jobs:
  general_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Yarn
        uses: ./.github/workflows/actions/setup-yarn

      - name: Build packages
        run: yarn run build

      - name: Commitlint
        if: ${{ github.event_name == 'pull_request' }}
        # The title goes through an environment variable, not `${{ }}` in the script: an expression
        # is pasted into the script before bash runs, so backticks or `$(...)` in a title would run.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | yarn commitlint

      - name: Linters
        run: |
          yarn run prettier
          yarn run lint

      - name: Check Mapping
        run: yarn run check-mapping
